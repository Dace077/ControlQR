name: Compilar version para Play

# Genera el AAB firmado que se sube a Google Play Console, y un APK firmado para
# pruebas internas. Ninguno se publica en un Release de GitHub: la distribucion a
# los usuarios finales se hace exclusivamente por Google Play.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar, por ejemplo 1.1.0'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Calcular la versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Compilando versión $VERSION"

      - name: Restaurar el almacén de llaves
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Falta KEYSTORE_BASE64. Play rechaza compilaciones sin la llave real."
            exit 1
          fi

      - name: Pruebas unitarias
        run: gradle --no-daemon testReleaseUnitTest

      - name: Compilar AAB y APK firmados
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          # Play exige que este número suba en cada envío y nunca se repita.
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Publicar el AAB para Play Console
        uses: actions/upload-artifact@v4
        with:
          name: ControlQR-${{ steps.version.outputs.name }}-playstore
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publicar el APK para pruebas internas
        # Solo accesible para quien tenga permiso en el repositorio; no es una
        # via de distribucion publica.
        uses: actions/upload-artifact@v4
        with:
          name: ControlQR-${{ steps.version.outputs.name }}-apk-pruebas
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Borrar el almacén de llaves
        if: always()
        run: rm -f keystore.jks

      - name: Recordatorio
        run: |
          echo "AAB listo. Descárgalo desde los artefactos de esta ejecución y súbelo en"
          echo "Play Console > Producción > Crear versión."
          echo "Versión: ${{ steps.version.outputs.name }} (versionCode ${{ github.run_number }})"
